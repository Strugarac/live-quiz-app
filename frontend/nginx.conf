# Produkcioni nginx: igra ulogu koju u razvoju ima Vite proxy (vidi vite.config.ts).
# "backend" je ime servisa iz docker-compose.prod.yml.
server {
    listen 80;
    client_max_body_size 60m;          # upload slika (backend dozvoljava 55MB po zahtevu)

    root /usr/share/nginx/html;
    index index.html;

    # React Router: svaka nepoznata putanja vraca index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend kontejner
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP) -> backend, sa Upgrade zaglavljima
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;      # da nginx ne prekine dugu WS konekciju
    }
}
