<!DOCTYPE html>
<!--
  Throwaway manual-test client for Step 5 (live gameplay over STOMP).
  Served by the backend itself at http://localhost:8080/live-test.html, so there is no
  CORS involved. Open one tab as HOST and one or more as PARTICIPANT.
  Delete once the real React client (Step 9) exists.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live quiz — WebSocket test client</title>
    <!-- 7.3, not 7.0: heartbeatStrategy/TickerStrategy only exist from 7.1 onwards. -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; max-width: 900px; }
        fieldset { margin-bottom: 16px; }
        label { display: inline-block; width: 130px; }
        input { width: 320px; padding: 4px; }
        button { padding: 6px 12px; margin-right: 6px; }
        #log { background: #111; color: #0f0; padding: 12px; height: 380px;
               overflow-y: auto; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
        .status { font-weight: bold; }
        #options label { width: auto; display: block; margin: 4px 0; }
    </style>
</head>
<body>
<h1>Live quiz — WebSocket test client</h1>

<fieldset>
    <legend>Connect</legend>
    <p>
        <label for="role">Role</label>
        <select id="role">
            <option value="PARTICIPANT">PARTICIPANT</option>
            <option value="HOST">HOST</option>
        </select>
    </p>
    <p>
        <label for="joinToken">joinToken</label>
        <input id="joinToken" placeholder="from POST /api/professor/sessions">
    </p>
    <p>
        <label for="participantToken">participantToken</label>
        <input id="participantToken" placeholder="participant only — from the join response">
    </p>
    <p>
        <label for="sessionId">sessionId</label>
        <input id="sessionId" placeholder="host only — the session UUID">
    </p>
    <p>
        <button id="connect">Connect</button>
        <button id="disconnect">Disconnect</button>
        <span class="status" id="status">disconnected</span>
    </p>
</fieldset>

<fieldset>
    <legend>Actions</legend>
    <p><button id="askState">Ask for state (/app/session/state)</button></p>
    <div id="question"><em>No question open.</em></div>
    <div id="options"></div>
    <p>
        <label for="freeText">Free text</label>
        <input id="freeText" placeholder="for FREE_TEXT questions">
    </p>
    <p><button id="answer">Submit answer (/app/session/answer)</button></p>
</fieldset>

<h3>Events</h3>
<div id="log"></div>

<script>
    const $ = (id) => document.getElementById(id);
    let client = null;
    let currentQuestion = null;

    function log(label, data) {
        const line = `[${new Date().toLocaleTimeString()}] ${label}` +
            (data === undefined ? '' : ' ' + JSON.stringify(data, null, 2));
        $('log').textContent += line + '\n';
        $('log').scrollTop = $('log').scrollHeight;
    }

    function renderQuestion(q) {
        currentQuestion = q;
        if (!q) {
            $('question').innerHTML = '<em>No question open.</em>';
            $('options').innerHTML = '';
            return;
        }
        $('question').innerHTML =
            `<strong>Q${q.questionIndex + 1}/${q.questionCount} (${q.type}):</strong> ${q.text ?? ''}`;
        const inputType = q.type === 'MULTI_CHOICE' ? 'checkbox' : 'radio';
        $('options').innerHTML = (q.options || []).map(o =>
            `<label><input type="${inputType}" name="opt" value="${o.id}"> ${o.text ?? o.id}</label>`).join('');
    }

    function handleEvent(frame) {
        const event = JSON.parse(frame.body);
        log('<< ' + event.type, event.payload);
        if (event.type === 'QUESTION_OPENED') {
            renderQuestion(event.payload);
        } else if (event.type === 'SESSION_STATE' || event.type === 'ANSWER_ACCEPTED') {
            renderQuestion(event.payload.question);
        } else if (event.type === 'QUESTION_CLOSED' || event.type === 'SESSION_ENDED') {
            renderQuestion(null);
        }
    }

    // Remember the tokens across reloads. sessionStorage is per-TAB, so the host tab and
    // each participant tab keep their own values and a refresh costs nothing.
    const FIELDS = ['role', 'joinToken', 'participantToken', 'sessionId'];

    function restoreFields() {
        FIELDS.forEach(id => {
            const saved = sessionStorage.getItem(id);
            if (saved !== null) {
                $(id).value = saved;
            }
            $(id).addEventListener('change', () => sessionStorage.setItem(id, $(id).value));
        });
    }

    function connect() {
        FIELDS.forEach(id => sessionStorage.setItem(id, $(id).value));
        const role = $('role').value;
        const joinToken = $('joinToken').value.trim();
        const headers = role === 'HOST'
            ? {role: 'HOST', sessionId: $('sessionId').value.trim()}
            : {participantToken: $('participantToken').value.trim()};

        client = new StompJs.Client({
            brokerURL: 'ws://localhost:8080/ws',
            connectHeaders: headers,
            // Reconnect by itself: the server drops every client session at once when the
            // app restarts or the RabbitMQ relay connection blips, and the real client
            // (Step 9) must survive that too.
            reconnectDelay: 5000,
            // Browsers throttle timers in hidden tabs to ~1/min, so a backgrounded
            // participant misses its heartbeat and RabbitMQ drops the connection
            // ("Connection to broker closed."). Two defences, because a quiz player's
            // tab is backgrounded constantly:
            //  - tick from a Web Worker, which browsers do not throttle;
            //  - ask the server for heartbeats but promise none of our own (0), so being
            //    late can never by itself get us disconnected.
            heartbeatIncoming: 10000,
            heartbeatOutgoing: 0,
            heartbeatStrategy: StompJs.TickerStrategy.Worker,
            onConnect: () => {
                $('status').textContent = 'connected as ' + role;
                log('CONNECTED as ' + role);

                client.subscribe('/topic/session.' + joinToken, handleEvent);
                client.subscribe('/user/queue/session', handleEvent);
                if (role === 'HOST') {
                    client.subscribe('/topic/session.' + joinToken + '.host', handleEvent);
                }
                client.publish({destination: '/app/session/state'});
            },
            onStompError: (f) => log('STOMP ERROR: ' + f.headers['message'], f.body),
            onWebSocketClose: () => {
                $('status').textContent = 'disconnected';
                log('SOCKET CLOSED');
            }
        });
        client.activate();
    }

    $('connect').onclick = connect;
    $('disconnect').onclick = () => client && client.deactivate();

    $('askState').onclick = () => client.publish({destination: '/app/session/state'});

    $('answer').onclick = () => {
        const optionIds = [...document.querySelectorAll('input[name=opt]:checked')].map(i => i.value);
        const body = {
            questionId: currentQuestion ? currentQuestion.questionId : null,
            optionIds: optionIds,
            freeText: $('freeText').value || null
        };
        log('>> answer', body);
        client.publish({destination: '/app/session/answer', body: JSON.stringify(body)});
    };

    // On load, restore this tab's tokens and reconnect straight away if they are all there,
    // so refreshing the page is free. This is also the reconnect path a real participant
    // takes after a reload: connect, subscribe, then ask for SESSION_STATE.
    restoreFields();
    const ready = $('joinToken').value &&
        ($('role').value === 'HOST' ? $('sessionId').value : $('participantToken').value);
    if (ready) {
        log('Restored tokens for this tab — reconnecting.');
        connect();
    }
</script>
</body>
</html>
