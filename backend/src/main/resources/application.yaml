spring:
  application:
    name: backend
  profiles:
    default: dev
  # Question / answer-option image uploads (stored in the quiz_image table).
  # Kept in step with ImageService.MAX_SIZE_BYTES.
  servlet:
    multipart:
      max-file-size: 50MB
      # Slightly above max-file-size to leave room for multipart framing overhead.
      max-request-size: 55MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
  tomcat:
    # When an upload is rejected for exceeding max-file-size, Tomcat has to read and discard
    # the rest of the body before it can reply. Its 2 MB default cap on that would abort the
    # connection instead, so an over-limit upload would surface as a connection reset rather
    # than the 413 from GlobalExceptionHandler. -1 removes the cap.
    max-swallow-size: -1

# Application settings.
# join-base-url: frontend join page; the session join token is appended, and the
# resulting URL is what the frontend renders as a QR code for participants.
#
# websocket.broker.mode: relay = broadcasts go through RabbitMQ's STOMP port, so several
#   backend instances can host the same session. Requires the rabbitmq service from
#   docker-compose.yml to be running. Set to `simple` for Spring's in-memory broker
#   (single instance, no RabbitMQ needed).
app:
  join-base-url: ${JOIN_BASE_URL:http://localhost:5173/join}
  websocket:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    broker:
      mode: ${WS_BROKER_MODE:relay}
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_STOMP_PORT:61613}
      virtual-host: ${RABBITMQ_VHOST:/}
      username: ${RABBITMQ_USERNAME:livequiz}
      password: ${RABBITMQ_PASSWORD:livequiz}
