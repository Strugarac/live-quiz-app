spring:
  application:
    name: backend
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
  tomcat:
    max-swallow-size: -1

app:
  join-base-url: ${JOIN_BASE_URL:http://localhost:5173/join}
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
    cleanup:
      enabled: ${MEDIA_CLEANUP_ENABLED:true}
      interval: PT1H
      initial-delay: PT5M
      min-age: PT24H
  websocket:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    broker:
      mode: ${WS_BROKER_MODE:relay}
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_STOMP_PORT:61613}
      virtual-host: ${RABBITMQ_VHOST:/}
      username: ${RABBITMQ_USERNAME:livequiz}
      password: ${RABBITMQ_PASSWORD:livequiz}
