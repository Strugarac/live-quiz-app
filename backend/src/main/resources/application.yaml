spring:
  application:
    name: backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080

# Application settings.
# join-base-url: frontend join page; the session join token is appended, and the
# resulting URL is what the frontend renders as a QR code for participants.
app:
  join-base-url: ${JOIN_BASE_URL:http://localhost:5173/join}
