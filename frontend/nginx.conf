# Produkcioni nginx: igra ulogu koju u razvoju ima Vite proxy (vidi vite.config.ts).
# "backend" je ime servisa iz docker-compose.prod.yml. Aplikacija zivi pod /livequiz/
# (isti raspored kao na fakultetskom serveru iza reverse proxy-ja).
server {
    listen 80;
    client_max_body_size 60m;          # upload slika (backend dozvoljava 55MB po zahtevu)

    # Koren -> aplikacija. Relativan Location, da se sacuva port kad je kontejner mapiran
    # na nesto drugo od 80 (npr. 8081 lokalno).
    absolute_redirect off;
    location = / {
        return 302 /livequiz/;
    }

    # REST API -> backend kontejner (backend ima context-path /livequiz, pa se putanja ne prepisuje)
    location /livequiz/api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (STOMP) -> backend, sa Upgrade zaglavljima
    location /livequiz/ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;      # da nginx ne prekine dugu WS konekciju
    }

    # Staticki fajlovi (Vite build sa base=/livequiz/, kopiran u html/livequiz/);
    # React Router: svaka nepoznata putanja vraca index.html
    location /livequiz/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /livequiz/index.html;
    }
}
