# Blokovi za postojeci nginx "server { }" sajta imi.pmf.kg.ac.rs (HTTPS vec resen tamo).
# Frontend build (dist/) je raspakovan u /var/www/livequiz, backend slusa na 127.0.0.1:8080
# sa context-path /livequiz, pa se putanje NE prepisuju.

    # REST API -> backend
    location /livequiz/api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;      # upload slika u pitanjima
    }

    # WebSocket (STOMP) -> backend; Upgrade zaglavlja + dug timeout da se konekcija ne prekida tokom kviza
    location /livequiz/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
    }

    # Staticki frontend; React Router: svaka nepoznata putanja vraca index.html
    location /livequiz/ {
        root /var/www;
        try_files $uri $uri/ /livequiz/index.html;
    }

# ---------------------------------------------------------------------------
# Ekvivalent za Apache 2.4 (moduli: proxy, proxy_http, proxy_wstunnel, rewrite):
#
#   ProxyPreserveHost On
#   ProxyPass        /livequiz/api/ http://127.0.0.1:8080/livequiz/api/
#   ProxyPassReverse /livequiz/api/ http://127.0.0.1:8080/livequiz/api/
#   ProxyPass        /livequiz/ws   http://127.0.0.1:8080/livequiz/ws upgrade=websocket
#   ProxyPassReverse /livequiz/ws   http://127.0.0.1:8080/livequiz/ws
#   ProxyTimeout 3600
#   LimitRequestBody 62914560
#   Alias /livequiz /var/www/livequiz
#   <Directory /var/www/livequiz>
#       Require all granted
#       RewriteEngine On
#       RewriteBase /livequiz/
#       RewriteCond %{REQUEST_FILENAME} !-f
#       RewriteCond %{REQUEST_FILENAME} !-d
#       RewriteRule . index.html [L]
#   </Directory>
