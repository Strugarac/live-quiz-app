spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false

app:
  websocket:
    # Zamenjuje localhost/LAN listu iz application.yaml; vise adresa razdvojiti zarezom.
    allowed-origins: ${WS_ALLOWED_ORIGINS}
